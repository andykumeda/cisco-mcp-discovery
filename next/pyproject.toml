[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cisco-mcp-server"
version = "0.1.0"
description = "Independent prototype MCP server for Cisco IOS/IOS-XE command execution and topology discovery"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Andy Kumeda" }
]
dependencies = [
  "mcp>=1.30.0,<2",
  "netmiko>=4.5,<5",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.10",
]

[project.scripts]
cisco-mcp-server = "cisco_mcp_server.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cisco_mcp_server"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
